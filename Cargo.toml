# The orchestrator's Rust workspace. Each crate lives under `crates/` and
# opts into the shared package fields, lints and dependency versions below.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["quality-data"]
repository = "https://github.com/government-data/orchestrator"

[workspace.dependencies]
# The orchestrator's own crates.
engine-port = { path = "crates/engine-port" }
orchestration-model = { path = "crates/orchestration-model" }
orchestrator-postgres = { path = "crates/orchestrator-postgres" }
schedule = { path = "crates/schedule" }

# The same versions as the core's.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Schedules: dates with a time zone, and the 5-field cron (crontab's) that
# `croner` takes as is.
chrono-tz = "0.10"
croner = "3"
# The engine port's JSON Schemas, derived from its own types.
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The stable random delay of a trigger.
sha2 = "0.10"
# PostgreSQL, with the Tokio runtime and rustls (ring), the migration
# runner and `migrate!`'s embed macro; runtime queries only, never the
# compile-time `query!` macros.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "migrate",
    "macros",
    "chrono",
    "json",
    "uuid",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
# Ephemeral PostgreSQL containers for the integration tests.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"
# Functions over `too-many-lines-threshold` (clippy.toml) fail CI.
too_many_lines = "warn"

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
