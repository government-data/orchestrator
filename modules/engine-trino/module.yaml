# The engine-trino module's manifest for quality-sdk (decisions 0002, 0009,
# 0011 and 0013): the Trino coordinator on the master server, the rules
# service that merges the core's grants into Trino's rules, and the job
# runners. Its version is the module's own; a release tag is
# `engine-trino-v` + this version. Trino's release is `trino-cluster`'s
# version, which query-trino's workers require exactly.
name: engine-trino
version: 0.1.0

provides:
  capabilities:
    # Trino's client protocol for BI and other consumers (core decision 0089).
    - name: sql-query
      version: 1
      protocols: [trino-client-protocol, mtls-internal]
    # The coordinator workers join: its version is the Trino release.
    - name: trino-cluster
      version: 484
      protocols: [trino-internal]

requires:
  capabilities:
    - name: lake
      version: 1
      protocols: [s3, iceberg-rest, mtls-gate]
    - name: orchestration
      version: 1
      protocols: [engine-port/1]

# The runners and the rules service call the engine port and the core's
# routes with the module's machine client (decision 0009): the engine port
# for the capability `orchestration`, and every core route under
# `/internal/quality/v1` (the job routes and the job grants) with the
# audience `core` (core decision 0090, rulings 94 and 97); the orchestrator
# records which module carries `trino`.
oidc:
  machine:
    capabilities: [orchestration]
    audiences: [core]

# Generated once by the installation, never written by a person: the
# coordinator's internal shared secret and its lake user's keys, under the
# fixed names of a query engine's lake keys (rulings 51 and 89). The same
# values must reach query-trino's `trino-worker` role, which declares them
# as role secrets; the core makes the lake user when they arrive. Trino
# runs as uid 1000.
secrets:
  uid: 1000
  generate:
    - name: trino-shared-secret
      bytes: 32
      critical: true
    - name: lake-query-engine-access-key
      bytes: 16
      critical: true
    - name: lake-query-engine-secret-key
      bytes: 32
      critical: true

# No `topology`: every service runs on the master. Workers are query-trino's.

data:
  volumes:
    # The sources' catalogs that `CREATE CATALOG` writes, and the rendered
    # configuration: kept on remove, deleted only by purge.
    - name: coordinator-data
      service: coordinator
      path: /data/trino
      critical: true
    - name: spill
      service: coordinator
      path: /spill
      critical: false

health:
  services: [coordinator, lake-proxy, rules, runner]
