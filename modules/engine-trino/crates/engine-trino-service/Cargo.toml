# engine-trino's two services (decision 0011): the job runner, which claims
# runs from the orchestrator and runs the core's bundles on Trino, and the
# rules service, which merges the core's grants into Trino's rules. Their
# adapters: the core and the orchestrator over mTLS, Trino's protocol.
