# The Trino coordinator of engine-trino, on the master server (decision
# 0011). `${ENV:…}` values come from compose.yml and entrypoint.sh, which
# appends the tier's memory and spill settings (tiers.sh): Trino reads one
# config.properties.
coordinator=true
# Tiers XS to M: one node is coordinator and worker; tier L: the work goes
# to query-trino's workers on the clusters (entrypoint.sh, TRINO_TIER).
node-scheduler.include-coordinator=${ENV:TRINO_INCLUDE_COORDINATOR}
catalog.management=dynamic
catalog.store=file
# Linear-time regular expressions, as on every node (core decision 0090,
# point 8.7). Trino 484 names the setting `deprecated.regex-library`
# (`regex-library` still works, with a warning).
deprecated.regex-library=RE2J

# Between the nodes: HTTPS only, the internal communication's shared
# secret (a generated secret file, read by entrypoint.sh), each node by
# its machine name (the coordinator by trino.<master's name>), trusting the
# installation's CA alone.
discovery.uri=${ENV:TRINO_DISCOVERY_URI}
node.internal-address=${ENV:TRINO_INTERNAL_ADDRESS}
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
internal-communication.https.required=true
internal-communication.https.truststore.path=/run/qd-node/ca.crt

# HTTPS with the machine's certificate (one PEM file, certificate then
# key), read again every minute, so a renewal restarts nothing. On 443,
# unpublished: the core's Traefik passes trino.<master's name> through to
# it, so the address Trino announces (https://trino.<name>:443) is the one
# the workers reach. Plain HTTP, never published, is for the health check.
http-server.http.port=8090
http-server.https.enabled=true
http-server.https.port=443
http-server.https.keystore.path=/run/qd-node/machine.pem
http-server.https.ssl-context.refresh-time=1m

# Clients: a JWT of the core's OIDC provider for audience `trino` (ES256),
# its public keys as files per key id (entrypoint.sh); the subject becomes
# a Trino user by user-mapping.json (core decision 0090, point 7.1).
http-server.authentication.type=jwt
http-server.authentication.jwt.key-file=/data/trino/jwks/${KID}.pem
http-server.authentication.jwt.required-issuer=${ENV:TRINO_JWT_ISSUER}
http-server.authentication.jwt.required-audience=trino
http-server.authentication.jwt.user-mapping.file=/data/trino/etc/user-mapping.json
http-server.authentication.allow-insecure-over-http=false
http-server.process-forwarded=true
web-ui.enabled=false

# No result is kept: no spooling, no event listener; the query history at
# its defaults (point 7.6).
protocol.spooling.enabled=false

# Admission: the resource groups and the session property manager by group
# (resource-groups.properties, session-property-config.properties; points
# 6.3 and 6.4); the low-memory killer stays Trino's default.

log.console-format=json
