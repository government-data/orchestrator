# Who may do what: one rules document, merged by engine-trino's rules
# service from the core's neutral grants (core decision 0090, point 7.2),
# served to the coordinator on the module's own network. Trino keeps it 10
# seconds; while the service does not answer, every query fails.
access-control.name=file
security.config-file=${ENV:TRINO_RULES_URL}
security.refresh-period=10s
