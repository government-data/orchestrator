# The lake for every job but maintenance (core decision 0090, point 6.4):
# the file rules decide; no expiry or orphan removal can run here.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:TRINO_LAKE_S3_URL}/iceberg
iceberg.rest-catalog.warehouse=${ENV:TRINO_LAKE_WAREHOUSE}
iceberg.rest-catalog.security=SIGV4
iceberg.rest-catalog.signing-name=s3
iceberg.security=ALLOW_ALL
iceberg.expire-snapshots.min-retention=36500d
iceberg.remove-orphan-files.min-retention=36500d
iceberg.add-files-procedure.enabled=false
iceberg.register-table-procedure.enabled=false
fs.s3.enabled=true
fs.cache.enabled=false
s3.endpoint=${ENV:TRINO_LAKE_S3_URL}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:TRINO_LAKE_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRINO_LAKE_SECRET_KEY}
